# Ghost Churn Backend — Render deploy
#
# IMPORTANT: Render Workflows are NOT created by this blueprint.
# The worker below does NOT register workflow tasks (causes "not found" errors).
# Create a Workflow service manually: see WORKFLOW_SETUP.md
#
# Keep only the web service here; delete the worker after creating a real Workflow.

services:
  - type: web
    name: ghost-churn-backend
    env: python
    region: oregon
    plan: free
    rootDir: AWS_loft/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 8000
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: RENDER_WORKFLOW_SLUG
        sync: false
      - key: RENDER_TASK_AGENT_EVAL
        sync: false
      - key: RENDER_TASK_SEND_EMAIL
        sync: false
      - key: RENDER_API_KEY
        sync: false
      - key: TESTMAIL_API_KEY
        sync: false
      - key: TESTMAIL_NAMESPACE
        sync: false
      - key: TESTMAIL_TO_EMAIL
        sync: false
      - key: TESTMAIL_FROM_EMAIL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
